  justification: Igor Vorobyov is Head of the Volgograd local branch of the Centre
    for Military and Patriotic Training and Education of Youth “Warrior”. The Warrior
    Centre is a Russian state-led youth organisation established in the Russian Federation
    to foster patriotic and military education among young people. It involves cadet-style
    military instruction, weapons and tactical training. It operates with the support
    of the President of the Russian Federation who instructed the Warrior Centre to
    work in close cooperation with participants in Russia’s war of aggression against
    Ukraine. The Warrior Centre also conducts activities in the illegally occupied
    territories of Ukraine, through local branches.
