  justification: Major General Vadim Pankov is the Commander of the 45th Separate
    Guards Special Purpose Brigade (Spetsnaz), which is part of Russia’s elite airborne
    forces. He participated in the annexation of Crimea in 2014, leading special forces
    operations. Vadim Pankov commanded units during Russia’s invasion of Ukraine.
    His brigade was involved in the occupation of Bucha. He is accused of ordering
    the execution of 30 local residents and forcing civilians to remove the bodies
    of dead Russian soldiers. Those atrocities constitute crimes against humanity
    and war crimes.
