  justification: PJSC Moscow Exchange MICEX-RTS is a Russian financial institution
    and Russia’s largest public exchange group. It plays an essential role in the
    functioning of Russia’s financial system, thus directly and indirectly enabling
    the Government of the Russian Federation in its activities, policies and resources.
    PJSC Moscow Exchange MICEX-RTS constitutes the central platform for domestic financing
    and trading, notably for investments into Russian military corporations and government
    bonds (OFZs) issued by the Ministry of Finance. The mission of the Moscow Exchange
    is to provide exhaustive access to the Russian financial markets, and it is under
    a high degree of control of the Government of the Russian Federation through its
    role and shareholders, including the Central Bank of Russia. Two PJSC Moscow Exchange
    MICEX-RTS subsidiaries, the National Settlement Depository (NSD) and the National
    Clearing Centre (NCC) have been recognised as systemically important financial
    markets infrastructure institutions by the Central Bank of Russia. The NSD has
    been listed by the Union.
