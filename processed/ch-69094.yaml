  justification: Since 31 July 2025, Lieutenant General Nyo Saw has been Prime Minister.
    From September 2023, he was a member of the State Administration Council after
    having been appointed senior advisor to the State Administration Council (SAC)
    Chairman, Senior General Min Aung Hlaing (who has been designated since 22.3.2021)
    at the rank of a Union Minister, until the SAC was replaced by the State Security
    and Peace Commission (SSPC) on 31 July 2025. He has been a member of the SSPC
    since 31 July 2025. He is also head of a committee tasked with importing fuel
    from Russia, the regime’s major arms supplier. Nyo Saw retired from the army in
    2020 as quartermaster general. He also serves as a member of the Foreign Exchange
    Supervision Committee (FESC) and as the chairman of the military-owned conglomerate
    Myanmar Economic Corporation (MEC), both of which generate revenue for the regime.
    He is also a member of the patron group of Myanmar Economic Holdings Ltd (MEHL).
    As a member of the SAC and advisor to the SAC Chairman, Nyo Saw plays a key role
    in maintaining and orchestrating the military dictatorship in Myanmar that seized
    power through a military coup in 2021, overthrowing the democratically elected
    government. Through his roles in the steering of military owned enterprises and
    in managing fuel imports from Russia, including for military use, he also provides
    economic supports and income to the military regime. Nyo Saw is associated with
    former and current junta regime members.
