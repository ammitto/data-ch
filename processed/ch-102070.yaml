  justification: Mohsen Ebrahimi is the Commander of Iran’s Counter-Terrorism Special
    Force (NOPO), an entity listed by the Union. NOPO is a subdivision of the Special
    Units of Iran’s Law Enforcement Forces (LEF). NOPO is a highly trained specialised
    unit often deployed to dissolve protests. NOPO has used excessive violence and
    lethal force against unarmed protestors, including women and children. Its human
    rights violations have been documented throughout various protests, including
    the nationwide protests in Iran that began in December 2025.
