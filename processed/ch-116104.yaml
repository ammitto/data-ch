  justification: JSC “IRZ” is a Russian holding company, who owns LLC “Irz-Svyaz”,
    which is a manufacturer of communication systems that perform the function of
    switching, mostly for navigation receivers and has licenses for production and
    repair of weapons and military equipment. As a subsidiary of JSC “IRZ”, LLC “Irz-Svyaz”
    supplies components to the military-industrial complex of the Russian Federation,
    as its manufactured products are used in UAVs “Orlan-10” and “Tachion”, used by
    Russian armed forces in Ukraine. Moreover, LLC “Irz-Svyaz” is one of systemically
    important enterprises in Russia, in the field of manufacturing navigation receivers
    for GPS and GLONASS, which is a Russian satellite navigation system designed for
    operational navigation and time support for an unlimited number of land, sea,
    air and space-based users.
