  justification: Joint Stock Company “Aerodrommash” is a Russian company specialised
    in the production and maintenance of aircraft launching system, in particular
    ballons and airships. It also holds a licence for the maintenance of weapons.
    Joint Stock Company “Aerodromash” is leading a project for the development of
    an unmanned stratospheric platform, the “Barrier-1”, under the auspices of the
    Russian Foundation for Advanced Research. This Foundation has been established
    under Russian law and with funding from the Russian federal budget to foster innovation
    in the Russian military and industrial sector to the benefit of the Russian national
    defence. The “Barrier-1” unmanned stratospheric platform will ultimately benefit
    the Russian armed forces by providing access to Internet connection in Ukraine
    and enabling unmanned aerial vehicle attacks.
