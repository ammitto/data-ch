  justification: JSC Susuman Mining and Processing Plant “Susumanzoloto” is a mining
    and metallurgical company in Russia, involved in the mining and processing of
    gold. It operates multiple goldmines in Russia. The export of precious metals
    is one of the most significant sources of revenue to the Government of the Russian
    Federation after oil and gas revenue. As of 2025, Russia is the second largest
    gold producing country in the world. Therefore, JSC Susuman Mining and Processing
    Plant “Susumanzoloto” is involved in economic sectors providing a substantial
    source of revenue to the Government of the Russian Federation, which is responsible
    for the annexation of Crimea and the destabilisation of Ukraine.
