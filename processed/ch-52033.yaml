  justification: Former member of the Federation Council that ratified the government
    decisions on the “Treaty of Friendship, Cooperation and Mutual Assistance between
    the Russian Federation and the Donetsk People’s Republic” and the “Treaty of Friendship,
    Cooperation and Mutual Assistance between the Russian Federation and the Luhansk
    People’s Republic”. Oleg Tkach is the founder of OLMA publishing house, then called
    OLMA Media Group. He maintained control and influence over the business conducted
    by the OLMA Media Group, and in particular the publishing house “Enlightenment”,
    which is part of the OLMA Media Group, until the Government of the Russian Federation
    took full control of the publishing house in September 2025. Since 2022, the publishing
    house “Enlightenment” has been directly involved in promoting Russia’s war of
    aggression against Ukraine. Oleg Tkach therefore supports and has implemented
    actions or policies which undermine or threaten the territorial integrity, sovereignty
    and independence of Ukraine.
