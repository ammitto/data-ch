  justification: Michael Makuei Lueth held the position of Minister for Information
    and Broadcasting in the Revitalised Transitional Government of National Unity
    in South Sudan from 2013 to November 2025. Since November 2025, he holds the position
    of Minister of Justice and Constitutional Affairs of South Sudan. He was also
    the public spokesman for the government delegation to the Intergovernmental Authority
    on Development peace talks from 2014 to 2015 and from 2016 to 2018.
