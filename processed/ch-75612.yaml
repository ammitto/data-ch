  justification: Roman Trotsenko is a leading businessperson operating in Russia,
    with business interests in iron ore and steel, coal, infrastructure and energy
    companies, considered as one of the richest persons in Russia. He is a prominent
    shareholder in AEON Corporation and Vorkutagol JSC, which operate in economic
    sectors providing a substantial source of revenue to the Government of the Russian
    Federation. In June 2025, he participated in the St. Petersburg International
    Economic Forum (SPIEF) as Chairman of the Board of Directors of AEON Corporation.
    Furthermore, he is an important indirect shareholder of Group Russian Energy LLC,
    through his shareholding in other companies. Roman Trotsenko e is also an indirect
    shareholder and is involved in the management of Novaport Holding. Novaport Holding
    is a holding company which manages, among other things, controlling stakes in
    several regional airports. It is owned by TES Trans Syberia, in which Roman Trotsenko
    is a beneficial owner and an indirect shareholder, through his shareholding in
    AEON AERO LLC, which is part of the ownership structure of Novaport Holding.
