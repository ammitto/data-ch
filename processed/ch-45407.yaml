  justification: Myanmar War Veterans Organization (MWVO) is a non-governmental organisation
    that aims at providing support to former members of the Myanmar Armed Forces (Tatmadaw).
    It is the main organisation that weighs in on social and economic issues related
    to the military in the country.The central patron group of MWVO is represented
    by high-ranking figures of Tatmadaw such as Commander-in-Chief Min Aung Hlaing
    and Deputy-Commander-in-Chief Soe Win. Members of the MWVO are part of the governance
    structure of the military-led conglomerates, the Myanmar Economic Holdings Limited
    (MEHL) and Myanmar Economic Corporation Limited (MEC). Therefore, MWVO is associated
    with persons and entities listed under Council Decision (CFSP) 2013/184 and Council
    Regulation (EU) No 401/2013.
