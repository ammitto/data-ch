  justification: PJSC “Inter RAO UES” is one of Russia’s largest energy companies,
    with revenue in 2023 reaching 1,36 trillion rubles, the company has around 19
    million consumers. It is controlled by the Government of the Russian Federation.
    Shareholders of PJSC “Inter RAO UES” include state-owned companies “Rosseti” and
    “Rosneftegaz”, one of the largest dividend payers to the budget of the Russian
    Federation. Members of the board of directors of the company include listed persons
    Igor Ivanovich Sechin, CEO of “Rosneft” and close ally of Vladimir Putin, and
    Dmitry Evgenevich Shugaev, director of the Federal Service for Military-Technical
    Cooperation of the Russian Federation. Due to the high revenue, importance in
    Russia’s energy sector and government control, PJSC “Inter RAO UES” plays a significant
    role in an important economic sector in Russia and the Government of the Russian
    Federation collects part of PJSC “Inter RAO UES”’s revenue through taxes and dividends
    paid out by its owners.
