  justification: Moscow Institute of Physics and Technology (MIPT) is one of a Russian
    institutions that trains professionals for the Russian military and industrial
    complex. The institute has launched dedicated programs in drone technologies and
    conducts state-funded drone research. MIPT has a military training centre whose
    focus is training in the military specialties established for MIPT, corresponding
    to the main civilian areas of training of the institute. MIPT has several partners
    that manufacture drones, including the “Almaz-Antey”, the “Kronstadt” design bureau
    and the “Geoscan”. MIPT is therefore materially supporting Russia’s military and
    industrial complex and is supporting and benefitting from the Government of the
    Russian Federation, which is responsible for the annexation of Crimea and the
    destabilisation of Ukraine.
