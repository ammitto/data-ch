  justification: Aleksandr Kalyagin is the Minister of Education and Science of the
    Zaporizhzhia Oblast region under the Russian occupation administration since April
    2025. In that capacity, he has approved and overseen the implementation of programmes
    of patriotic education in schools that introduce systemic ideological and military-patriotic
    activities for pupils, including lessons promoting state narratives, activities
    related to Russian historical memory and state symbols, and participation in youth
    initiatives with military-patriotic elements. In addition, Aleksandr Kalyagin
    has signed a cooperation agreement with the All-Russian organisation “Voluntary
    Society for Assistance to the Army, Aviation and Navy of Russia” (DOSAAF) to implement
    youth programmes aimed at strengthening patriotic education.
