  justification: Colonel Aleksey Tolmachev, the Commander of the 104th Airborne Assault
    Regiment of the 76th Guards Air Assault Division, participated in Russia’s invasion
    of Ukraine. From February to April 2022, he commanded the 104th Airborne Assault
    Regiment as part of the “Vostok” group of forces. His area of operations was the
    western part of Kyiv Oblast. Units subordinate to Aleksey Tolmachev were involved
    in committing war crimes against civilians in the cities of Bucha and Irpen.
