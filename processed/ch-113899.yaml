  justification: Suniel Kumar Sharma is a businessperson involved in setting up ship
    registries in various countries. Many of the governments of those countries have
    later rejected his involvement and accused him or companies linked to him of operating
    without proper authority, issuing invalid certificates, or continuing registry
    activities after approvals were revoked. Several governments have reported that
    entities connected to him have registered vessels fraudulently. He is the managing
    director of Oceaniek Technologies, which is the administrative hub for various
    maritime enterprises, including MSTA-International Maritime Registries & Regulatory
    Inc and Aruba Maritime Administration & Offshore Company Registry. Therefore,
    Suniel Kumar Sharma is associated with MSTA-International Maritime Registries
    & Regulatory Inc and Aruba Maritime Administration & Offshore Company Registry,
    both listed under Council Regulation (EU) No 269/2014 for providing material support
    to vessels transporting crude oil or petroleum products from Russia while practicing
    irregular and high-risk shipping practices as set out in the International Maritime
    Organisation General Assembly resolution A.1192(33).
