  justification: Antonina Shepchenko, Director of the Municipal Budgetary General
    Education Institution “Gvardeyskaya School No. 1” of the Simferopol District in
    the occupied Crimea, actively implements Russian state policies aimed at promoting
    Russian identity among Ukrainian minors and militarising the school’s curriculum.
    She promotes and implements military-patriotic education intended to instil loyalty
    to the Russian Federation, by repeatedly organising events glorifying the annexation
    of Crimea, the Russian army and Russian soldiers, including in cooperation with
    patriotic-military organisations. Shepchenko also continuously supports the future
    military involvement of local youth by making her school the first in the Simferopol
    district to introduce a “cadet class”, a specialized class combining general education
    with additional military-patriotic training.
