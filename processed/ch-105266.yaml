  justification: LLC “Irz-Svyaz” is a Russian manufacturer of communication systems
    that perform the function of switching, mostly for navigation receivers. LLC “Irz-Svyaz”
    has licenses for production and repair of weapons and military equipment, and
    the company supplies components to the military andindustrial complex of the Russian
    Federation, as its manufactured products are used in UAV’s “Orlan-10” and “Tachion”,
    used by Russian armed forces in Ukraine. LLC “Irz-Svyaz” also sells its manufactured
    goods to Russian military and industrial complex companies, such as JSC “Votokinsk
    Plant”, a known manufacturer of Iskander-M ballistic missiles. Moreover, LLC “Irz-Svyaz”
    is a systemically important enterprise in Russia in the field of manufacturing
    navigation receivers for GPS and GLONASS, which is a Russian satellite navigation
    system designed for operational navigation and time support for an unlimited number
    of land, sea, air and space-based users.
