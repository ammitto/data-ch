  justification: Vladimir Evgenievych Avetisyan is a majority shareholder in and beneficial
    owner of several companies with business interests in various sectors of the Russian
    economy such as banking and, in particular, the energy sector. He is a majority
    shareholder in and the ultimate owner of “Srednevolzhskaya gazovaya kompaniya”,
    a provider of gas distribution through mains, which ranks 12th by revenue in this
    sector on the Russian market, and a majority shareholder and ultimate owner of
