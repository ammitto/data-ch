  justification: Ruslan Garbalî is the Head of the “Vulcănești” territorial organisation
    of the “Renaștere” political party in the Republic of Moldova. He was involved
    in organising paid protests in anticipation of the parliamentary elections of
    2025. The protests were announced by Ilan Shor, and Ruslan Garbalî had the executive
    role of contacting the participants and ensuring they were paid. Moreover, he
    participated in the launch event for the “Victory/Pobeda” political bloc, alongside
    Ilan Shor.
