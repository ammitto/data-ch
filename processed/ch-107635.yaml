  justification: JSC Research Institute of Precision Instruments NII TP is an organisation
    conducting activities in the space and military sphere and supplies the Russian
    Ministry of Defence and also the Ministry of Emergency Situations with special
    equipment and services. The company is part of the “Roscosmos” state corporation
    and participates as a key enterprise in various Russian space projects run by
    the “Roscosmos”. The company has been working on the new satellite system for
    the Russian army, the Kasatka-R synthetic space radar. At the Army Forum 2024
    the company presented the Kasatka-R radar and the Compact-4 synthetic radar developed
    for capturing highly detailed images of terrain and objects. Furthermore in September
    2025 the company’s monitoring flight equipment was used during the flight of the
    Bion-M No. 2 biosatellite into space.
