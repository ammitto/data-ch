  justification: Svetlana Dmitrova has been the Head of the so-called “Department
    of Education of the Administration of Simferopol District” in the occupied Crimea
    since at least 2017. In this capacity, she actively promotes “military-patriotic
    education” for minors in the Simferopol district, aiming to cultivate loyalty
    to the Russian Federation. She is responsible for implementing the program “Youth
    of the Simferopol District” which aims to integrate pupils into an all-Russian
    space. Furthermore, she supports and participates in events glorifying the Russian
    army and encourages youth engagement in future military service. Under her leadership,
    her department cooperated with organizations such as UNARMIA, Volunteers of Victory,
    the Movement of the First, and DOSAAF. Under her direction, at least 36 cadet
    classes were opened in district schools to promote service in the Russian armed
    forces and law-enforcement bodies. She also facilitated the issuance of Russian
    passports to local youth and supported events celebrating the annexation of Crimea.
