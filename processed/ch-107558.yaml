  justification: JSC “Lavochkin Research and Production Association” was founded by
    state corporation for space activities “Roscosmos” and carries out work on the
    design, manufacture, testing and comprehensive development of automatic spacecraft.
    It also maintains weapons and military equipment. JSC “Lavochkin Research and
    Production Association” works with the Ministry of Defence to create a satellite
    remote sensing system to improve the effectiveness of military troops. The company’s
    parent satellites are part of the Russia’s military space surveillance network.
    Therefore, JSC “Lavochkin Research and Production Association” is materially supporting
    the Government of the Russian Federation, which is responsible for the annexation
    of Crimea and the destabilisation of Ukraine. In addition, JSC “Lavochkin Research
    and Production Association” is supporting Russia’s military and industrial complex,
    including by being involved in the development of military technology and equipment.
