  justification: Vadim Vasiliev is the former Deputy Minister of Construction, Housing
    and Utilities of the Russian Federation, in charge of the Department for the Implementation
    of Regional Investment Programmes, the Department for Coordination of Socio-Economic
    Development of Regions and the Department of Social and Economic Development of
    Certain Territories. He was in charge of implementing the policy of the Ministry
    of Construction in the annexed regions of Donetsk, Luhansk, Zaporizhzhia and Kherson.
    Subsidies from the federal budget of the Russian Government are channelled through
    the Ministry of Construction in order to strengthen the “redevelopment” of the
    Ukrainian regions currently under Russian control. Currently, he is the director
    of the Department of Regional Development of Russia, which is part of the Ministry
    of Economic Development of the Russian Federation. Therefore, he is still a member
    of the Russian government.
