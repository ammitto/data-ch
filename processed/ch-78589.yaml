  justification: Ilia Uzun is a member of the People’s Assembly of Gagauzia and Deputy
    President of the Executive Committee of the Autonomous Territorial Unit (ATU)
    of Gagauzia. He met Ilan Shor in Israel to discuss the implementation in Gagauzia
    of the electoral plans of Governor (Bashkan) Evghenia Guțul. Since Evghenia Guțul’s
    detention in March 2025, Ilia Uzun has been acting Bashkan of ATU Gagauzia, and
    has been publicly declaring that all matters pertaining to the functioning of
    the Executive Committee are being coordinated with Evghenia Guțul through her
    lawyers, even though the law of the Republic of Moldova does not provide for procedures
    that would allow matters to be coordinated with a former Bashkan once she is no
    longer performing her duties.
