  justification: Oleg Trofimov has served as Acting Minister of Education and Science
    of the so-called “Donetsk People’s Republic” since 31 August 2024 and exercises
    executive authority over the education system in the so-called “Donetsk People’s
    Republic”. As a Deputy Chairperson of the Interdepartmental Coordinating Council
    on preparation for military service and military-patriotic education, Oleg Trofimov
    participates in the coordination of policies targeting minors on the territory
    of Ukraine in respect of their indoctrination and militarised education. Under
    Oleg Trofimov’s leadership, the Ministry of Education and Science introduced state-approved
    history textbooks for all grades and is currently in the process of creating a
    unified textbook on the history of Donbas and Novorossiya. Furthermore, the Ministry
    of Education and Science has been promoting educational programmes designed to
    instil loyalty to the Russian state, its military, and its historical and cultural
    narratives. Oleg Trofimov has supported the institutionalisation of military-patriotic
    instruction, cooperation with paramilitary youth organisations, and the integration
    of pre-military training and military-sports activities into schools.
