  justification: Association “League for Assistance to Defence Enterprises” is a non-profit
    organisation based in Moscow. It consists of representatives from the Government
    of the Russian Federation, federal legislative and executive bodies, heads and
    representatives of public and private military industry corporations, major holdings,
    associations and enterprises. The organisation aims to promote the development,modernisation
    and further growth of the Russian military industry. It advocates for the interests
    of the domestic defence industry with Russian government bodies and civil society
    institutions, in particular to promote innovation, strengthen training and foster
    recruitment opportunities for defence companies. It also aims to assist Russian
    defence companies in the implementation of the state armament program and state
    military procurement.
