name: Generated data proposal tests

on:
  pull_request:
    paths:
      - '.github/scripts/generated_data_pr*'
      - '.github/workflows/fetch.yml'
      - '.github/workflows/propagate.yml'
      - '.github/workflows/publication-tests.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/generated_data_pr*'
      - '.github/workflows/fetch.yml'
      - '.github/workflows/propagate.yml'
      - '.github/workflows/publication-tests.yml'

permissions:
  contents: read

jobs:
  proposal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 .github/scripts/generated_data_pr_test.py
