name: Fetch Data

on:
  schedule:
    # Run daily at 7:45 AM UTC
    - cron: '45 7 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch.yml'

jobs:
  fetch-data:
    name: Fetch Switzerland Sanctions Data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Fetch data
        run: |
          # yeptris's precompiled native materializer can't dlopen its own
          # dependency on this runner, and its FFI fallback corrupts the
          # heap after ~50 YAML dumps. lutaml-model auto-selects yeptris
          # for every YAML (de)serialization whenever the gem is present,
          # which it is here as a transitive dependency, so this forces
          # the plain Psych-backed adapter before loading the CLI. `load`
          # (not `exec`) keeps this in the same process so the adapter
          # config carries into the fetch run; RUBYOPT can't do this
          # inline (it rejects -e), and `Gem.bin_path` resolves the CLI
          # correctly for a github-sourced gem, same as `bundle exec
          # ammitto` would.
          bundle exec ruby -e "
            require 'lutaml/model'
            Lutaml::Model::AdapterResolver.set_adapter_type(:yaml, :standard)
            load Gem.bin_path('ammitto', 'ammitto')
          " -- fetch ch --format yaml --output-dir processed --verbose

      - name: Check for changes
        id: check_changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: github.ref_name == github.event.repository.default_branch && steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A fetch writes processed/ and nothing else. Staging the whole
          # checkout would let an unrelated eligible file ride along on a
          # harvest commit.
          git add -A -- processed/
          git commit -m "chore: update Switzerland sanctions data ($(date +%Y-%m-%d))"
          git push

      - name: Create issue on failure
        if: github.ref_name == github.event.repository.default_branch && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Fetch failed - ${{ github.run_id }}',
              body: 'The fetch workflow failed. See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              labels: ['automation', 'fetch']
            })
