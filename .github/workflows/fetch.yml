name: Fetch Data

on:
  schedule:
    # Run daily at 7:45 AM UTC
    - cron: '45 7 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch.yml'

concurrency:
  group: data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-data:
    name: Fetch Switzerland Sanctions Data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A scheduled/queued default-branch event can carry an older SHA.
          # Generate from the latest accepted branch; preserve PR/nondefault
          # validation refs and their restricted credential below.
          ref: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.repository.default_branch || github.ref }}
          # PR validation never receives the publisher credential. The helper
          # separately refuses an absent PAT instead of silently using a token
          # whose generated PR would not trigger the expected checks.
          token: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && secrets.AMMITTO_CI_PAT_TOKEN || github.token }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Fetch data
        run: |
          bundle exec ammitto fetch ch --format yaml --output-dir processed --verbose --prune

      - name: Propose generated data
        id: proposal
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.AMMITTO_CI_PAT_TOKEN }}
          PUBLICATION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python3 .github/scripts/generated_data_pr.py
          --branch automation/data-refresh
          --title 'chore: update Switzerland sanctions data'
          --path processed

      - name: Create issue on failure
        if: github.ref_name == github.event.repository.default_branch && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Fetch failed - ${{ github.run_id }}',
              body: 'The fetch workflow failed. See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              labels: ['automation', 'fetch']
            })
