name: Propagate accepted data

on:
  push:
    branches: [main]
    paths:
      - 'processed/**'

permissions:
  contents: read

jobs:
  harmonize:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger harmonization after data is accepted
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AMMITTO_CI_PAT_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'ammitto',
              repo: 'data',
              workflow_id: 'harmonize.yml',
              ref: 'main'
            });
